# Example a2aserve configuration. Copy to a2aserve.yaml (git-ignored) and edit.
#
# Core runtime fields also exist as CLI flags (which override this file);
# credentials, auth and policy fields (inboundPermissions, inboundMedia,
# questions, models, cards) live only here. No environment variables are read.
#
#   a2aserve --config a2aserve.yaml

listen: 127.0.0.1:9099            # bind loopback by default
# baseURL: ""                     # optional; the A2A server's public base URL (cards)

root: /absolute/path/to/state     # REQUIRED: SDK state directory (absolute; ~ is not expanded)
# workingDirectory: .             # project the agent operates on (default: process cwd)

# configDirs:                     # agents/skills loaded from markdown files
#   - ./agents

model: deepseek-flash             # REQUIRED: model id sent to the provider
protocol: openai-compatible-chat  # REQUIRED: openai-compatible-chat | openai-chat | openai-responses | anthropic-messages | gemini | bedrock-converse
modelBaseURL: https://api.deepseek.com  # model API base URL; empty uses the protocol default
inputModalities: [text, image]    # optional: input modalities the model accepts (text/image/audio/video/pdf). DeepSeek accepts text and images; media outside these is omitted from requests
dropErroredTurns: true            # server default: exclude a turn that ended in error from later contexts (prevents a rejected message from wedging the session); false = opt out

# models:                         # optional; additional models an agent may name
#   - id: gemini-2.5-flash        # catalog id (agent `model:` names this)
#     protocol: gemini
#     modelBaseURL: https://generativelanguage.googleapis.com
#     media: { input: [text, image, audio, video], sources: [inline, file] }  # modalities + sources
#     credentials: { apiKey: ... }

# inboundMedia: spool             # spool (default) writes inbound A2A files into the workspace; inline delivers known media to the model
questions: decline                # default: reject the question tool (A2A clients poll task state and cannot answer),
                                  # so the turn ends with the dismissal instead of parking forever; set park for a
                                  # client that answers input-required (e.g. an agent calling this one via task)

credentials:                      # REQUIRED: the only place a secret is read
  apiKey: <your-deepseek-api-key> #   bearer/header protocols
  # aws:                          #   Amazon Bedrock (SigV4), instead of apiKey
  #   region: us-east-1
  #   accessKeyId: <id>
  #   secretAccessKey: <secret>
  #   sessionToken: <token>       #   optional

agents: [build]                   # existing agent names to expose
cards:                          # optional per-agent card overrides (advertised over A2A)
  build:                        # key must be an exposed agent name
    name: Build Agent
    description: "An autonomous coding agent that maintains the go-agent-sdk project: it reads, writes, edits and patches files, runs build/test commands, and searches the codebase, subject to the configured inbound permissions."
    version: "1.0.0"
    documentationUrl: https://github.com/jiaweisky/go-agent-sdk
    provider: { organization: jiaweisky, url: https://github.com/jiaweisky }
    # skills:                   # optional; operator-authored labels on the card. Omitted here
    #                           # (the common case) → the card advertises an empty array [].
    #                           # Each entry needs id+name+description; NOT a mirror of the agent's tools.

# contextLimit: 128000            # optional; drives automatic compaction
# outputLimit: 8192               # optional
# inboundPermissions:             # default: SDK deny-by-default ruleset
#   - { action: bash, resource: "*", effect: deny }
keepAlive: 15s

# auth:                           # optional; when set, the RPC endpoints require a bearer token
#   bearer: <token>
# allowInsecure: false            # required to bind a non-loopback address without auth

# tls:                            # optional; serve HTTPS when both are set
#   certFile: /etc/a2aserve/tls.crt
#   keyFile: /etc/a2aserve/tls.key
