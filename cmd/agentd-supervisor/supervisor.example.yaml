# agentd-supervisor example configuration.
#
# A reusable host supervisor for agentd. Point a host's `supervisor_command` at
# this binary; it satisfies the acquire/release JSON protocol by calling a
# running agentd's control API, so the host spawns no Go processes
# itself. String values may reference environment variables (the agentd loader).

agentd:
  baseURL: http://127.0.0.1:9090          # a running agentd with `control.listen` set
  token: ${AGENTD_CONTROL_TOKEN:-}        # control.auth.token, if configured

project:                                  # template cloned for each acquired project
  kind: http                              # http | a2a
  rootBase: /var/lib/agentd/projects      # per-project SDK state root = rootBase/<project_id>
  workingDirectory: /srv/source           # the source project; agentd derives the isolated view
  configDirs: [./agents]
  models: [deepseek-flash]
  defaultModel: deepseek-flash
  agents: [build]
  isolation:                              # ignored for read-only conversations (shared source)
    mode: worktree                        # none | copy | worktree | overlay
    baseDir: /var/lib/agentd/views
    baseReadOnly: true
  # sandbox:                              # optional command sandbox for the instance's tools
  #   wrapper: seatbelt                   # none (default) | bwrap | seatbelt | appcontainer
  #   failurePolicy: fail-closed          # fail-closed (default) | fail-open
  auth:
    type: bearer
    token: ${AGENTD_INSTANCE_TOKEN:-}     # optional per-instance transport auth
