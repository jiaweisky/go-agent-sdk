# agentserve configuration. Copy to agentserve.yaml (git-ignored) and edit.
# No environment variables are read; credentials and the auth token live only
# here.
listen: 127.0.0.1:8787
root: ~/.go-agent-sdk             # required; the SDK state directory
workingDirectory: /srv/project
configDirs: [/srv/project/.agents]
model: deepseek-flash             # required
protocol: openai-compatible-chat  # required
modelBaseURL: https://api.deepseek.com
inputModalities: [text, image]    # optional; input modalities the model accepts (text/image/audio/video/pdf). DeepSeek accepts text and images; media outside these is omitted from requests
credentials:                      # required; the only secret source (no env)
  apiKey: sk-...                  # or credentials.aws: { region, accessKeyId, secretAccessKey, sessionToken }
contextLimit: 128000
outputLimit: 8192
# models:                           # optional; additional models an agent/subagent may name
#   - id: gemini-2.5-flash          # catalog id (what an agent's `model:` field names)
#     protocol: gemini
#     modelBaseURL: https://generativelanguage.googleapis.com
#     media: { input: [text, image, audio, video], sources: [inline, file] }  # modalities + sources
#     credentials: { apiKey: ... }
#   - id: deepseek-vision
#     model: deepseek-flash         # wire model name when it differs from the id
#     providerID: deepseek          # credential key; defaults to the protocol
#     protocol: openai-compatible-chat
#     media: { input: [text, image], sources: [inline, url, file] }
#     credentials: { apiKey: ... }
subagentDepth: 1
titleAuto: false
dropErroredTurns: true             # server default: exclude a turn that ended in error from later contexts (prevents a rejected message from wedging the session); false = opencode-CLI behavior (recover via revert)
agents: [build]                   # allow-list of usable agents
auth:
  bearer: <token>                 # optional; required for non-loopback binds
inboundPermissions:               # REPLACES the SDK deny-by-default (not additive)
  - { action: bash, resource: "*", effect: deny }
  - { action: write, resource: "*", effect: deny }
  - { action: edit, resource: "*", effect: deny }
interactionTimeout: 5m            # optional HITL fallback
interactionFallback: reject
subscriberCapacity: 256
keepAlive: 15s
publicRoutes: [/api/health]
cors: []                          # extra browser origins
# mcp:                            # optional MCP servers (tools are registered)
#   - name: filesystem
#     type: local
#     command: [npx, -y, "@modelcontextprotocol/server-filesystem", /srv/project]
#     environment: { NODE_ENV: production }
#     timeout: 30s
#   - name: remote
#     type: remote
#     url: https://mcp.example.com/mcp
#     headers: { Authorization: "Bearer <token>" }
# references:                     # optional named reference sources
#   - name: docs
#     type: local
#     path: /srv/docs
#     description: Product docs
#   - name: lib
#     type: git
#     repository: https://github.com/example/lib
#     branch: main
# tls:                            # optional; serve HTTPS when both are set
#   certFile: /etc/agentserve/tls.crt
#   keyFile: /etc/agentserve/tls.key
allowInsecure: false
