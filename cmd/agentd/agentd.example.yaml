# agentd example configuration.
#
# One process serves the configured `servers`; each server is one agent client
# over one listener. Models are defined once in the global model registry and
# selected per server by id.
#
# The whole file (including comments) is expanded with envsubst before YAML
# decoding, so a variable without a fallback must be set, `${VAR:-default}`
# supplies one, and `$$` is a literal dollar sign. Values containing
# YAML-special characters (`#`, `: `) need the placeholder inside a quoted
# scalar; quoting changes the YAML style, it is not escaping. No environment is
# read implicitly — only where the file asks for it (shown on apiKey, token,
# workingDirectory below; it works for modelBaseURL, cards.name/description too).
#
# `modelBaseURL` is the *base* only: the protocol appends its own path
# (`/chat/completions`, `/responses`, `/messages`).

models:
  # deepseek-flash speaks three wire protocols. Each is a separate registry entry:
  # `id` is the agent-facing name, `model` is the value actually sent to the
  # provider. They are equal here but need not be.

  - id: deepseek-flash                        # OpenAI Chat Completions
    model: deepseek-flash
    protocol: deepseek-chat
    providerID: deepseek
    providerFileAPI: deepseek
    modelBaseURL: https://api.deepseek.com     # + /chat/completions
    credentials:
      apiKey: ${DEEPSEEK_API_KEY:-replace-me}
    inputModalities: [text, image]
    contextLimit: 1000000
    outputLimit: 384000

  - id: deepseek-flash-responses              # OpenAI Responses API
    model: deepseek-flash
    protocol: openai-responses
    providerID: deepseek
    providerFileAPI: deepseek
    modelBaseURL: https://api.deepseek.com     # + /responses
    credentials:
      apiKey: ${DEEPSEEK_API_KEY:-replace-me}
    inputModalities: [text, image]
    contextLimit: 1000000
    outputLimit: 384000

  - id: deepseek-flash-anthropic              # Anthropic Messages API
    model: deepseek-flash
    protocol: anthropic-messages
    providerID: deepseek-anthropic
    providerFileAPI: deepseek-anthropic-files
    modelBaseURL: https://api.deepseek.com/anthropic  # + /messages
    credentials:
      apiKey: ${DEEPSEEK_API_KEY:-replace-me}
    inputModalities: [text, image]
    contextLimit: 1000000
    outputLimit: 384000

# Reusable provider Files API profiles. A model opts in with
# `models[].providerFileAPI`; nothing is inferred from the protocol or URL.
# `openai` and `anthropic` profiles follow the same shape (see
# docs/DESIGN-MEDIA-PROVIDERS.md §4.5.3).
providerFileAPIs:
  deepseek:
    kind: multipart-json
    url: https://api.deepseek.com/files
    auth:
      headers:
        Authorization: "Bearer ${DEEPSEEK_API_KEY:-replace-me}"
    fields:
      purpose: user_data
    idField: id
    expiry:
      style: expires_after
      seconds: 86400
    mime:
      allowed: [image/jpeg, image/png, image/gif, image/webp]
    limits:
      maxBytes: 67108864
      timeout: 10m

  # OpenAI Files API contract (use a distinct name for a proxy).
  openai:
    kind: multipart-json
    url: https://api.openai.com/v1/files
    auth:
      headers:
        Authorization: "Bearer ${OPENAI_API_KEY:-replace-me}"
    fields:
      purpose: user_data
    idField: id
    expiry:
      style: none
    mime:
      allowed:
        - application/pdf
        - text/plain
        - text/markdown
        - text/csv
        - application/json
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.ms-powerpoint
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
    limits:
      maxBytes: 52428800
      timeout: 2m

  # DeepSeek's optional Anthropic-compatible Files API.
  deepseek-anthropic-files:
    kind: multipart-json
    url: https://api.deepseek.com/anthropic/v1/files
    auth:
      headers:
        x-api-key: "${DEEPSEEK_API_KEY:-replace-me}"
        anthropic-beta: "files-api-2025-04-14"
    modelHeaders:
      anthropic-beta: "files-api-2025-04-14"
    idField: id
    expiry:
      style: expires_in_seconds
      seconds: 86400
    mime:
      allowed: [image/jpeg, image/png, image/gif, image/webp]
    limits:
      maxBytes: 67108864
      timeout: 10m

  # Anthropic Files API.
  anthropic:
    kind: multipart-json
    url: https://api.anthropic.com/v1/files
    auth:
      headers:
        x-api-key: "${ANTHROPIC_API_KEY:-replace-me}"
        anthropic-version: "2023-06-01"
    idField: id
    expiry:
      style: expires_in_seconds
      seconds: 86400
    mime:
      allowed: [application/pdf, text/plain, image/jpeg, image/png, image/gif, image/webp]
    limits:
      maxBytes: 524288000
      timeout: 10m

servers:
  - name: http
    kind: http
    listen: 127.0.0.1:8787
    root: ./var/http
    workingDirectory: ${AGENTD_WORKDIR:-.}
    configDirs: [./agents]
    # Expose all three protocols; a session picks one by id (default: the first).
    models: [deepseek-flash, deepseek-flash-responses, deepseek-flash-anthropic]
    defaultModel: deepseek-flash
    agents: [build]
    # Optional OS sandbox for this server's commands AND its in-process file
    # tools: `bwrap` on Linux, `seatbelt` on macOS, `appcontainer` on Windows.
    # sandbox:
    #   wrapper: seatbelt            # none (default) | bwrap | seatbelt | appcontainer
    #   failurePolicy: fail-closed   # fail-closed (default) | fail-open
    #   profile: standard            # off | standard | custom (default standard)
    #   filesystem:                  # read/write: allow (allow-list) | off (no confinement)
    #     read: allow                # Windows rejects off; Linux write:off needs read:off
    #     write: allow
    #     denyRead: ["**/.env"]      # a more specific deny beats a broad allow
    #     allowRead: []              # extra readable paths (e.g. a toolchain)
    #     denyWrite: []
    #     allowWrite: []
    #   network:
    #     mode: no-egress            # off | no-egress (a domain allow-list needs a proxy)
    #   unixSockets:
    #     mode: inherit              # inherit (follow the file policy) | allowAll | allowlist
    #     allow: []
    #   processInspection: deny      # deny | allow
    #   env:
    #     mode: scrub                # scrub | inherit
    #     scrub: ["*_KEY", "*_SECRET", "*_TOKEN", "*_PASSWORD"]
    #   violations:
    #     mode: heuristic            # heuristic | precise (linux, needs strace) | off
    #     reportToModel: true        # append "[sandbox] blocked ..." to command output
    # Each command also gets a private temp under {Root}/data/sandbox-tmp, so it
    # cannot see files or sockets another process left in the shared host temp.
    # Inbound media delivery policy (operator-owned).
    # Unset keeps the caller-declared behavior (inline-first, with a file fallback).
    media:
      delivery:
        inlineLimitBytes: 262144              # size budget: over this cannot be inlined
        prefer: [providerFile, inline]        # first feasible source; url is hosted or caller URL
        allowUploads: true                    # provider Files API and/or url hosting
        downsample: true                      # over budget -> shrink first, whatever source is picked next
        spool: { dir: "{Root}/data/spool" }   # last resort: on disk, under the state root
        maxBytes: 52428800                    # hard skip above this
      uploads:
        # Provider-independent URL host ({M17}); serves the model edge (url).
        # Backends: http | local | s3 | cos. Credentials authenticate the upload;
        # omit them for an anonymous/public origin or bucket. `s3` is S3-compatible
        # (AWS S3 / MinIO, and COS via its S3 endpoint); the native `cos` backend
        # drives Tencent COS over its own REST API (SHA1-signed).
        urlHost:
          backend: http                         # http | local | s3 | cos
          url: https://store.example/x/
          auth: bearer                          # none | basic | bearer (upload)
          token: ${STORE_TOKEN:-replace-me}                 # basic → username/password; or a custom header/value
          presignSecret: ${NGINX_SECURE_LINK:-replace-me}   # optional: sign returned urls (nginx secure_link)
          # backend: cos                          # http | local | s3 | cos
          # cos: { region: ap-guangzhou, bucket: my-bucket-1250000000,
          #        secretID: ${COS_SECRET_ID:-replace-me}, secretKey: ${COS_SECRET_KEY:-replace-me} }
    auth:
      type: bearer
      token: ${AGENTD_TOKEN:-replace-me}
    keepAlive: 15s

  # A2A server: the same client assembly, exposed over the A2A protocol on its
  # own listener (and its own client / state root). Card URLs come from `baseURL`
  # (or the request origin when omitted).
  - name: a2a
    kind: a2a
    listen: 127.0.0.1:8788
    root: ./var/a2a
    workingDirectory: ${AGENTD_WORKDIR:-.}
    configDirs: [./agents]
    models: [deepseek-flash]
    defaultModel: deepseek-flash
    agents: [build]
    # Remote A2A agents this server reaches as a client: each is registered as
    # an agent the local model delegates to with the task tool (or runs as a
    # primary agent). Works on http and a2a servers alike.
    # peers:
    #   - name: echo
    #     endpoint: http://127.0.0.1:9099        # remote A2A base URL (card discovery root)
    #     cardURL: http://127.0.0.1:9099/.well-known/agent-card.json   # optional; overrides endpoint
    #     description: A remote agent that echoes its input.
    #     mode: subagent                         # primary | subagent | all (default subagent)
    #     headers: { Authorization: "Bearer ${PEER_TOKEN:-replace-me}" }           # optional
    baseURL: http://127.0.0.1:8788
    inboundMedia: spool               # spool (default) | inline
    # transports: [jsonrpc, rest]     # protocol bindings; default [jsonrpc]
    # pushNotifications:              # client supplies the per-task webhook at runtime
    #   enabled: true                 # in-memory config store; lost on restart
    #   timeout: 10s
    #   allowPrivateNetworks: false   # keep the SSRF guard unless webhooks are internal
    # signing:                        # signatures are computed from this key
    #   keyFile: ./keys/card.pem
    #   keyID: key-1
    #   algorithm: ES256              # inferred from the key when omitted
    #   jwksURL: https://example/jwks.json
    # Work autonomously: run every tool; deny the question tool so a confirmation
    # request becomes a model-visible failure and the agent keeps working, rather
    # than parking at input-required (or ending the turn, as `questions: decline`).
    inboundPermissions:
      - { action: "*", resource: "*", effect: allow }
      - { action: "question", resource: "*", effect: deny }
    cards:                            # REQUIRED per exposed agent (name + description)
      build:
        name: Build Agent
        description: "Autonomous coding agent: reads, writes and edits files, runs commands and searches the repository, subject to the inbound permissions."
        version: "1.0.0"
        # documentationUrl and provider are optional card metadata (omit them freely):
        documentationUrl: https://github.com/jiaweisky/go-agent-sdk
        provider: { organization: jiaweisky, url: https://github.com/jiaweisky }
        # cardPath: /agents/build/.well-known/agent-card.json
        # defaultInputModes: [text/plain, application/json, image/png]
        # defaultOutputModes: [text/plain, application/json]
        # extended:                    # authenticated extended card; inherits public fields
        #   description: "Authenticated details for trusted clients."
        #   skills:
        #     - { id: review, name: Review, description: "reviews code", tags: [code] }
        # skills:                     # operator-authored labels; omitted → the card advertises []
    auth:
      type: bearer
      token: ${AGENTD_TOKEN:-replace-me}              # A2A is bearer-only like HTTP
    keepAlive: 15s

# Optional control API: create and destroy isolated project instances at runtime.
# The host (e.g. an IM bridge) uses it to lease one instance per project/group.
# Local isolation modes (none/copy/worktree/overlay) are served in-process, each
# on its own listener under `projectListen`; container/remote instances run in a
# separate process and are provisioned by the host instead.
# control:
#   listen: 127.0.0.1:9090          # control API bind address
#   projectListen: 127.0.0.1:0      # where dynamic instances bind (default loopback:0)
#   maxLeases: 32                   # cap live project instances (0 = unlimited)
#   auth:
#     type: bearer
#     token: ${AGENTD_CONTROL_TOKEN:-replace-me}

# Optional whole-process sandbox (Unix): re-exec agentd under bwrap/seatbelt so
# every server and tool shares one confinement. Only the filesystem policy
# applies to the wrapped process: it keeps the network and process introspection
# up (agentd serves listeners, calls the model and manages children) and
# inherits its own environment. Its config dirs, state roots and executable are
# re-allowed (the bootstrap exception).
# wrap:
#   wrapper: seatbelt
#   failurePolicy: fail-closed
#   profile: standard
#   filesystem: { read: allow, write: allow }
