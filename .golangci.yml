# golangci-lint configuration.
#
# Committing this file makes `make golangci` reproducible: without it,
# golangci-lint falls back to the developer's global config (or its built-in
# defaults), so the set of rules depends on the machine.
version: "2"

linters:
  # `standard` is errcheck, govet, ineffassign, staticcheck and unused.
  # Pinned explicitly so a global config cannot change the default set.
  default: standard
  enable:
    - lll
  settings:
    errcheck:
      # Ignoring these results is idiomatic and the error is not actionable
      # in context (typically a deferred cleanup or a write to a writer whose
      # failure is surfaced elsewhere).
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.RemoveAll
        - os.Rename
    staticcheck:
      # Keep the correctness checks (SA); drop the stylistic families
      # (stylecheck ST, quickfix QF).
      checks:
        - all
        - -ST*
        - -QF*
    govet:
      # The inline analyzer only suggests shortening constant references; it
      # adds noise without catching defects.
      disable:
        - inline
    lll:
      line-length: 120
      tab-width: 1
  exclusions:
    rules:
      # Test code may ignore errors from setup/cleanup calls and is not held to
      # the line-length limit (table-driven cases and fixtures read better wide).
      - path: _test\.go
        linters:
          - errcheck
          - lll
      # Cleanup/close/rollback results are ignored throughout; the error is not
      # actionable in context.
      - linters:
          - errcheck
        text: Error return value of .*(Close|Rollback|Remove|Rename)
      # Long SQL statements read better on one line.
      - linters:
          - lll
        source: (SELECT|INSERT INTO|UPDATE |CREATE TABLE|CREATE (UNIQUE )?INDEX|CONSTRAINT |FOREIGN KEY)
      # MCP logging and roots are deprecated pending migration (SEP-2577); the
      # calls remain functional during the deprecation window.
      - path: mcp/client\.go
        linters:
          - staticcheck
        text: SA1019

issues:
  # Report every finding, so results do not depend on golangci-lint's
  # default truncation.
  max-issues-per-linter: 0
  max-same-issues: 0
